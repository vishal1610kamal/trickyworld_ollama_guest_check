# Ollama behind a password (nginx). Ollama itself stays on 127.0.0.1:11434.
#
# 1. Keep Ollama local: OLLAMA_HOST unset (or 127.0.0.1:11434); for Docker, -p 127.0.0.1:11434:11434.
# 2. Make a password file:   sudo htpasswd -c -B /etc/nginx/ollama.htpasswd your-user
#    (htpasswd is in apache2-utils on Debian/Ubuntu, httpd-tools on Fedora/RHEL)
# 3. Put this file in /etc/nginx/conf.d/ (it's read inside the http {} block), set your hostname
#    and certificate paths, then: sudo nginx -t && sudo systemctl reload nginx
#
# Not run on the machine where this repository was tested (no nginx there); the Apache version in
# this folder was. Check it with `nginx -t` before you rely on it.

# Requests per second per client address. limit_req_zone has to sit in the http {} block.
limit_req_zone $binary_remote_addr zone=ollama:10m rate=10r/s;

server {
    listen 443 ssl;
    server_name ollama.example.com;

    ssl_certificate     /etc/letsencrypt/live/ollama.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ollama.example.com/privkey.pem;

    auth_basic           "Ollama";
    auth_basic_user_file /etc/nginx/ollama.htpasswd;

    # Model management and the signed-in account: nobody on the internet needs these. Manage
    # models over SSH. If a remote app must pull models, take "pull" out of this list.
    location ~ ^/api/(pull|push|create|copy|delete|blobs|me|signout|user|balance|usage|experimental|codex)(/|$) {
        return 403;
    }

    location / {
        limit_req zone=ollama burst=20 nodelay;

        proxy_pass http://127.0.0.1:11434;

        # Ollama bound to 127.0.0.1 refuses requests whose Host isn't local (its DNS-rebinding guard).
        proxy_set_header Host localhost:11434;

        # Ollama logs the left-most X-Forwarded-For address as the caller and trusts whatever a
        # client sends. Overwrite both headers so its log shows the real address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;

        # Stream tokens as they come, and allow long generations.
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 600s;

        client_max_body_size 50m;     # room for images in vision requests
    }
}

# Plain HTTP only redirects to HTTPS, so the password never crosses the network in the clear.
server {
    listen 80;
    server_name ollama.example.com;
    return 301 https://$host$request_uri;
}
