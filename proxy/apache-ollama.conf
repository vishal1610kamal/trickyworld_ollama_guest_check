# Ollama behind a password (Apache 2.4). Ollama itself stays on 127.0.0.1:11434.
#
# 1. Keep Ollama local: OLLAMA_HOST unset (or 127.0.0.1:11434); for Docker, -p 127.0.0.1:11434:11434.
# 2. Modules:  sudo a2enmod ssl proxy proxy_http headers auth_basic authn_file authz_user
# 3. Password: sudo htpasswd -c -B /etc/apache2/ollama.htpasswd your-user
# 4. Save as /etc/apache2/sites-available/ollama.conf, set your hostname and certificate paths,
#    then: sudo a2ensite ollama && sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Tested with Apache 2.4.52 by tests/test_proxy_live.py (GUESTCHECK_LIVE=1).

<VirtualHost *:443>
    ServerName ollama.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/ollama.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ollama.example.com/privkey.pem

    # Ollama logs the left-most X-Forwarded-For address as the caller and trusts whatever a client
    # sends. Drop the client's copies first; mod_proxy then adds the real address.
    RequestHeader unset X-Forwarded-For early
    RequestHeader unset X-Real-IP early

    <Location "/">
        AuthType Basic
        AuthName "Ollama"
        AuthBasicProvider file
        AuthUserFile "/etc/apache2/ollama.htpasswd"
        Require valid-user
    </Location>

    # Model management and the signed-in account: nobody on the internet needs these. Manage models
    # over SSH. If a remote app must pull models, take "pull" out of this list.
    <LocationMatch "^/api/(pull|push|create|copy|delete|blobs|me|signout|user|balance|usage|experimental|codex)(/|$)">
        Require all denied
    </LocationMatch>

    # ProxyPreserveHost stays Off, so Ollama sees Host: 127.0.0.1:11434 and accepts it.
    ProxyRequests Off
    ProxyPass        "/" "http://127.0.0.1:11434/" timeout=600
    ProxyPassReverse "/" "http://127.0.0.1:11434/"
</VirtualHost>

# Plain HTTP only redirects to HTTPS, so the password never crosses the network in the clear.
<VirtualHost *:80>
    ServerName ollama.example.com
    Redirect permanent "/" "https://ollama.example.com/"
</VirtualHost>
